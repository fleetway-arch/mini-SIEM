services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Bound to localhost: this MongoDB has no authentication.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./server/migrations/001_initial.js:/docker-entrypoint-initdb.d/001_initial.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: development
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: siem
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - add it to .env (openssl rand -hex 32)}
      JWT_TTL: 15m
      REFRESH_TTL: 168h
      # Plain http on localhost in development; keep true in production.
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://localhost:5173
      # Mailpit catches every email locally: open http://localhost:8025
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_REQUIRE_TLS: "false"
      MAIL_FROM: "Mini SIEM <no-reply@mini-siem.local>"
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - go-cache:/go

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules

volumes:
  mongo-data:
  go-cache:
  frontend-node-modules:
