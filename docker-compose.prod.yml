# Production stack: compiled API, static frontend behind nginx (HTTPS),
# MongoDB with authentication on an internal network. Only nginx is published.
#   docker compose -f docker-compose.prod.yml up --build -d
# Locally it serves https://localhost:8443 with a self-signed certificate.
name: mini-siem-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: siem
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required - add it to .env (openssl rand -hex 24)}
    volumes:
      - mongo-data:/data/db
      - ./server/migrations/001_initial.js:/docker-entrypoint-initdb.d/001_initial.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      MONGODB_URI: mongodb://siem:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DATABASE: siem
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - add it to .env (openssl rand -hex 32)}
      JWT_TTL: 15m
      REFRESH_TTL: 168h
      COOKIE_SECURE: "true"
      # nginx sets X-Forwarded-For, so per-IP rate limits see the real client.
      TRUST_PROXY: "true"
      APP_BASE_URL: ${PUBLIC_URL:-https://localhost:8443}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-https://localhost:8443}
      # Event ingestion (POST /api/ingest/events) and detection rules.
      RATE_LIMIT_INGEST_PER_KEY: ${RATE_LIMIT_INGEST_PER_KEY:-600}
      DETECT_BRUTE_FORCE_THRESHOLD: ${DETECT_BRUTE_FORCE_THRESHOLD:-10}
      DETECT_BRUTE_FORCE_WINDOW: ${DETECT_BRUTE_FORCE_WINDOW:-5m}
      # Leave SMTP_HOST empty to disable email (it is then only logged, without
      # content). A real provider must support STARTTLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${PUBLIC_URL:-https://localhost:8443}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - certs:/etc/nginx/certs
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

networks:
  backend:

volumes:
  mongo-data:
  certs:
